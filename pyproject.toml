[project]
authors = [{name = "carellihoula", email = "carellihoula10@gmail.com"}]
dependencies = [
    "google-generativeai",
    "python-dotenv",
    "questionary",
    "rich"
]
name = "AICLI"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
[tool.hatch.build.targets.wheel]
packages = ["src/aiassistcli"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
aicli = { path = ".", editable = true }

[project.scripts]
ai = "main:main"

[tool.pixi.tasks]
